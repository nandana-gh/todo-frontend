<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container">
    <span class="navbar-brand mb-0 h1 fw-bold">To-Do App</span>
    <div class="d-flex">
      <button class="btn btn-light btn-sm" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-3 p-md-4">
          <h2 class="mb-4 text-center">My Tasks</h2>
          
          <div class="d-flex flex-column flex-sm-row gap-2 mb-4">
            <input type="text" class="form-control form-control-lg w-100" placeholder="." 
                   [(ngModel)]="newTaskTitle" name="newTaskTitle" (keyup.enter)="addTask()">
            <button class="btn btn-primary btn-lg px-4 flex-shrink-0" type="button" (click)="addTask()" [disabled]="!newTaskTitle.trim()">
              Add Task
            </button>
          </div>
          
          <ul class="list-group list-group-flush">
            <li *ngFor="let task of paginatedTasks" class="list-group-item d-flex flex-column flex-sm-row justify-content-between align-items-sm-center py-3 border-bottom gap-2">
              <div class="d-flex align-items-center flex-grow-1 overflow-hidden">
                <input class="form-check-input me-3 fs-4 flex-shrink-0 mt-0" type="checkbox" [(ngModel)]="task.isCompleted" (change)="toggleTask(task)">
                <span [class.text-decoration-line-through]="task.isCompleted" [class.text-muted]="task.isCompleted" class="fs-5 text-break">
                  {{ task.title }}
                </span>
              </div>
              <button class="btn btn-outline-danger btn-sm align-self-end align-self-sm-auto flex-shrink-0" (click)="deleteTask(task.id)">
                Delete
              </button>
            </li>
          </ul>
          
          <nav *ngIf="tasks.length > pageSize" aria-label="Task pagination" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <button class="page-link" (click)="prevPage()">Previous</button>
              </li>
              <li class="page-item disabled">
                <span class="page-link text-dark">Page {{ currentPage }} of {{ totalPages }}</span>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <button class="page-link" (click)="nextPage()">Next</button>
              </li>
            </ul>
          </nav>

          <div *ngIf="tasks.length === 0" class="text-center text-muted mt-4">
            <p>No tasks yet. Add one above!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
