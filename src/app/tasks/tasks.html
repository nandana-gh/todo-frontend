<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container">
    <span class="navbar-brand mb-0 h1 fw-bold">To-Do App</span>
    <div class="d-flex">
      <button class="btn btn-light btn-sm" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-4">
          <h2 class="mb-4 text-center">My Tasks</h2>
          
          <div class="input-group mb-4">
            <input type="text" class="form-control form-control-lg" placeholder="What do you need to do?" 
                   [(ngModel)]="newTaskTitle" (keyup.enter)="addTask()">
            <button class="btn btn-primary" type="button" (click)="addTask()">Add Task</button>
          </div>
          
          <ul class="list-group list-group-flush">
            <li *ngFor="let task of tasks" class="list-group-item d-flex justify-content-between align-items-center py-3 border-bottom">
              <div class="d-flex align-items-center flex-grow-1">
                <input class="form-check-input me-3 fs-5" type="checkbox" [(ngModel)]="task.isCompleted" (change)="toggleTask(task)">
                <span [class.text-decoration-line-through]="task.isCompleted" [class.text-muted]="task.isCompleted" class="fs-5 text-break">
                  {{ task.title }}
                </span>
              </div>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteTask(task.id)">
                Delete
              </button>
            </li>
          </ul>
          
          <div *ngIf="tasks.length === 0" class="text-center text-muted mt-4">
            <p>No tasks yet. Add one above!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
