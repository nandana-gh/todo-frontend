<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 font-weight-light">Sign In</h3>
          
          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
          
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username" [(ngModel)]="username" required>
            </div>
            
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password" required>
            </div>
            
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg" [disabled]="!loginForm.form.valid">Login</button>
            </div>
          </form>
          
          <div class="text-center mt-4">
            <p class="text-muted">Don't have an account? <a routerLink="/register" class="text-decoration-none">Sign up</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
